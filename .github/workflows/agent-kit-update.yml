# Μπήκε από το agent-kit. Μία φορά την εβδομάδα ελέγχει αν βγήκε νέα έκδοση του κιτ και, αν ναι, ανοίγει PR.
# Χρειάζεται το μυστικό AGENT_KIT_TOKEN (κλειδί μόνο ανάγνωσης για το chrissaraf/agent-kit). Χωρίς αυτό απλώς παραλείπεται.
# Ό,τι έχει αλλάξει η εφαρμογή στα δικά της αντίγραφα δεν πατιέται (το ίδιο install.sh με την ενημέρωση με το χέρι).
name: Ενημέρωση agent-kit
on:
  schedule:
    - cron: "17 6 * * 1"   # Δευτέρα 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: agent-kit-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Υπάρχει κλειδί;
        id: key
        env:
          T: ${{ secrets.AGENT_KIT_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "Λείπει το μυστικό AGENT_KIT_TOKEN· παραλείπεται." >> "$GITHUB_STEP_SUMMARY"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: chrissaraf/agent-kit
          token: ${{ secrets.AGENT_KIT_TOKEN }}
          path: .agent-kit-src
      - if: steps.key.outputs.ok == 'true'
        name: Ενημέρωση και PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW=$(cat .agent-kit-src/VERSION)
          OUT=$(.agent-kit-src/install.sh .)
          rm -rf .agent-kit-src
          # Το GitHub δεν αφήνει το Actions να αλλάξει δικά του αρχεία ροής: αυτό το αρχείο το ενημερώνει μόνο η «Ενημέρωσε το agent-kit».
          WF=.github/workflows/agent-kit-update.yml
          if ! git diff --quiet -- "$WF"; then
            git checkout -- "$WF"
            python3 -c "import hashlib,json;p='docs/agent-kit/manifest.json';m=json.load(open(p));m['files']['$WF']=hashlib.sha256(open('$WF','rb').read()).hexdigest();json.dump(m,open(p,'w'),ensure_ascii=False,indent=1)"
            OUT="$OUT
          Η ίδια η αυτόματη ενημέρωση έχει νέα εκδοχή: γράψε «Ενημέρωσε το agent-kit» στο project για να μπει."
          fi
          echo "$OUT" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain)" ]; then echo "Ήδη στην τελευταία έκδοση ($NEW)." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          BR="agent-kit/$NEW"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null; then echo "Υπάρχει ήδη PR για την $NEW." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add -A
          git commit -qm "chore: κιτ agents $NEW"
          git push -q origin "$BR"
          gh pr create --head "$BR" --title "Κιτ agents $NEW" --body "$(printf 'Αυτόματη ενημέρωση του agent-kit.\n\n```\n%s\n```\n\nΟι agents φορτώνονται στην επόμενη νέα συνεδρία μετά το merge.\nΣημείωση: PR που ανοίγει το GitHub Actions δεν ξεκινά μόνο του τους ελέγχους της εφαρμογής· γράψε στο project «έλεγξε το PR του κιτ» ή κλείσ'\''το και ξανάνοιξέ το.' "$OUT")"
